# MetalLB Helm Values for home-lab
# Chart: metallb/metallb
# Namespace: metallb-system (default)
#
# Story: 3.1 - Deploy MetalLB for LoadBalancer Services
# FR: FR19 - Expose services via LoadBalancer using MetalLB

# Controller configuration
controller:
  # Resource limits for controller
  resources:
    limits:
      cpu: 100m
      memory: 100Mi
    requests:
      cpu: 25m
      memory: 50Mi

# BGP backend: both off. This cluster is L2-only — one IPAddressPool
# (192.168.2.100-149) and one L2Advertisement, no BGPPeer and no BGPAdvertisement.
#
# 0.16.0 flipped the chart defaults: speaker.frr.enabled true -> false and
# frrk8s.enabled false -> true, making frr-k8s the default BGP backend. Taking those
# defaults would deploy a whole frr-k8s DaemonSet, webhook and 4 extra CRDs to serve
# BGP that is not configured here. Both false selects the native backend, which
# upstream keeps "for deployments that require a smaller footprint".
#
# Effect: the speaker pod drops from 4 containers (speaker, frr, reloader,
# frr-metrics) to 1. FRR mode is deprecated upstream and scheduled for removal.
frrk8s:
  enabled: false

# Speaker configuration (DaemonSet on all nodes)
speaker:
  frr:
    enabled: false

  # Resource limits for speaker pods
  resources:
    limits:
      cpu: 100m
      memory: 100Mi
    requests:
      cpu: 25m
      memory: 50Mi

  # Tolerations decide how many nodes can answer ARP for the pool IPs.
  #
  # k3s-nas-worker carries workload-type=lightweight:NoSchedule. Because NoSchedule
  # repels new pods but never evicts running ones, the speaker that started there
  # before the taint existed kept running for 251 days and made coverage look wider
  # than the tolerations allowed. The 0.16.1 rollout on 2026-09-21 replaced that pod
  # and it could not come back, dropping the DaemonSet from 5 pods to 3. The upgrade
  # exposed this; any node reboot would have done the same.
  #
  # workload-type is tolerated deliberately: the taint exists to keep application
  # workloads off the Synology VM, not per-node infrastructure agents. node-exporter
  # and promtail already tolerate it for the same reason. The speaker requests
  # 25m CPU / 50Mi against a node sitting at 5% CPU and 4% memory.
  #
  # k3s-gpu-worker (gpu=true:NoSchedule) is deliberately NOT tolerated - it is
  # NotReady and Phase 6 is deferred.
  tolerations:
    - key: "node-role.kubernetes.io/control-plane"
      operator: "Exists"
      effect: "NoSchedule"
    - key: "node-role.kubernetes.io/master"
      operator: "Exists"
      effect: "NoSchedule"
    - key: "workload-type"
      operator: "Equal"
      value: "lightweight"
      effect: "NoSchedule"

# Prometheus metrics (for future observability integration)
prometheus:
  # Enable ServiceMonitor when Prometheus is deployed (Story 4.1)
  serviceMonitor:
    enabled: false
  # Enable PodMonitor for speaker pods
  podMonitor:
    enabled: false

# CRDs are managed by Helm
crds:
  enabled: true
  validationFailurePolicy: Fail
