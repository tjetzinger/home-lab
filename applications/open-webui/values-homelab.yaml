# Open-WebUI Helm values for home-lab
# Story: 17.1 - Deploy Open-WebUI with Persistent Storage
# Story: 26.2 - Update Service Default Models to Cloud Tier
# Epic: 17 - ChatGPT-like Interface (Open-WebUI)
# Epic: 26 - Ollama Pro Cloud Model Integration
# Chart: open-webui/open-webui
#
# FRs:
# - FR126: Open-WebUI deployed in `apps` namespace with persistent storage
# - FR127: Open-WebUI configured to use LiteLLM as backend (Story 17.2)
# - FR128: Open-WebUI accessible via ingress (Story 17.3)
# - FR220: Open-WebUI default model set to a cloud-tier model (Story 26.2)
#   ADR-013: now cloud-smart (kimi-k3 via LiteLLM, with fallback chain)
#
# NFRs:
# - NFR75: Web interface loads within 3 seconds
# - NFR76: Chat history persisted to NFS storage surviving pod restarts
# - NFR124: Cloud models auto-visible in model picker without per-model config

# Disable bundled Ollama (using LiteLLM role aliases + direct Ollama Pro cloud connection)
ollama:
  enabled: false

# Ollama Pro cloud endpoint — enumerates the account catalogue directly, so new
# models appear and retired ones drop off without any config change (ADR-013).
# Which of them reach the picker is curated via applications/open-webui/model-curation.json
ollamaUrls:
  - "https://ollama.com"

# OpenAI-compatible backend = LiteLLM proxy (FR127).
# These are CHART-NATIVE keys. They must NOT be repeated in extraEnvVars: the chart
# renders its own OPENAI_API_BASE_URL/OPENAI_API_KEY env vars, and a duplicate in
# extraEnvVars produces two entries for the same name. Kubernetes warns
# "hides previous definition ... may be dropped when using apply", and which one wins
# depends on ordering the chart controls. Pre-16.5.0 this repo had exactly that bug.
openaiBaseApiUrl: "http://litellm.ml.svc.cluster.local:4000/v1"
openaiApiKeyExistingSecret: "open-webui-secrets"
openaiApiKeyExistingSecretKey: "OPENAI_API_KEY"

# Disable bundled Pipelines (not needed)
pipelines:
  enabled: false

# Websockets ON, but without Redis. Single replica, so the in-memory session
# manager is enough — `manager: ""` leaves WEBSOCKET_MANAGER unset.
#
# Not optional for tool use: Open-WebUI only offers a model its builtin tools when
# the request carries a websocket session_id (utils/middleware.py:2769). With
# websockets off, native function calling can never fire in the browser.
websocket:
  enabled: true
  manager: ""
  redis:
    enabled: false

# Disable Tika (not needed)
tika:
  enabled: false

# Pod annotations
podAnnotations: {}

# Pod labels
podLabels:
  app.kubernetes.io/part-of: home-lab

# Resource limits for home lab
resources:
  requests:
    cpu: 250m
    memory: 512Mi
  limits:
    cpu: 1000m
    memory: 2Gi

# Persistent storage for chat history (NFR76)
persistence:
  enabled: true
  storageClass: nfs-client
  accessModes:
    - ReadWriteOnce
  size: 5Gi
  annotations:
    helm.sh/resource-policy: keep

# Service configuration
service:
  type: ClusterIP
  port: 80

# Ingress disabled - will configure in Story 17.3
ingress:
  enabled: false

# Environment variables
extraEnvVars:
  # Ollama Pro API key for the direct cloud connection above
  - name: OLLAMA_API_KEY
    valueFrom:
      secretKeyRef:
        name: open-webui-secrets
        key: OLLAMA_API_KEY
  # Enable OpenAI API for LiteLLM integration (Story 17.2)
  - name: ENABLE_OPENAI_API
    value: "true"
  # Web search via Exa (ADR-013 follow-up)
  # NOTE: all four of these are PersistentConfig vars — on an existing install the
  # DB value wins and these env vars are IGNORED. They seed a fresh install only.
  # Live changes go through /api/v1/retrieval/config or Admin -> Settings -> Web Search.
  - name: ENABLE_WEB_SEARCH
    value: "true"
  - name: WEB_SEARCH_ENGINE
    value: "exa"
  - name: WEB_SEARCH_RESULT_COUNT
    value: "5"
  - name: EXA_API_KEY
    valueFrom:
      secretKeyRef:
        name: open-webui-secrets
        key: EXA_API_KEY
  # NOTE: OPENAI_API_BASE_URL and OPENAI_API_KEY are deliberately NOT set here.
  # They come from openaiBaseApiUrl / openaiApiKeyExistingSecret above.
  # Default model - cloud-smart (kimi-k3) via LiteLLM
  # NOTE: DEFAULT_MODELS is a PersistentConfig var — on an existing install the DB
  # value wins and this env var is IGNORED. Change it in Admin Panel -> Settings
  # -> General as well. This line only takes effect on a fresh install. (ADR-013)
  - name: DEFAULT_MODELS
    value: "cloud-smart"
  # JWT signing key. Without this the container generates one at every boot into
  # /app/backend/.webui_secret_key — which is NOT on the data PVC, so every restart
  # invalidates every login session. Not a PersistentConfig var; the env var is
  # authoritative. Rotating it logs everyone out.
  - name: WEBUI_SECRET_KEY
    valueFrom:
      secretKeyRef:
        name: open-webui-secrets
        key: WEBUI_SECRET_KEY
  # Admin-level default for per-user interface settings. `webSearch: always` makes
  # every chat run Exa without touching the composer toggle.
  #
  # This is the ONLY durable place for it. Writing ui.webSearch on the user record
  # via /api/v1/users/user/settings/update does not survive: the frontend rewrites
  # the whole `ui` object from its own state and drops keys it did not load. The
  # admin default is applied server-side instead, and routers/users.py:71
  # (strip_default_interface_settings) removes any per-user value that matches it,
  # so there is nothing left for the browser to clobber.
  #
  # PersistentConfig: seeds a fresh install only. On an existing install set it via
  # POST /api/v1/auths/admin/config (read-modify-write — that endpoint rewrites
  # every admin field it receives).
  - name: DEFAULT_INTERFACE_SETTINGS
    value: '{"webSearch":"always"}'
  # Search query generation. The stock template says "prioritize generating 1-3
  # broad and relevant search queries", so one question cost three Exa calls.
  # This caps it at one while keeping the rewriting that matters: the model still
  # resolves "heute" into the actual date via {{CURRENT_DATE}}, which is what made
  # the German election answer correct.
  #
  # PersistentConfig: seeds a fresh install only. Live changes go through
  # POST /api/v1/tasks/config/update (read-modify-write — it rewrites every field).
  # Set ENABLE_SEARCH_QUERY_GENERATION=false instead to skip generation entirely
  # and search the raw message; cheaper again, but loses the date resolution.
  - name: QUERY_GENERATION_PROMPT_TEMPLATE
    value: |
      ### Task:
      Analyze the chat history and generate **exactly one** search query, in the given language, that best retrieves the information needed to answer the latest message. Return an empty list only if it is entirely certain that no search is required.

      ### Guidelines:
      - Respond **EXCLUSIVELY** with a JSON object. Any form of extra commentary, explanation, or additional text is strictly prohibited.
      - Respond in the format: { "queries": ["query1"] }. Never return more than one query.
      - If and only if it is entirely certain that no useful results can be retrieved by a search, return: { "queries": [] }.
      - Make the single query broad enough to cover the question on its own, since it is the only one that will run.
      - Today's date is: {{CURRENT_DATE}}. Resolve relative time references such as "heute", "today" or "this week" into the query.
      - Be concise. No elaboration, commentary, or assumptions.

      ### Output:
      Strictly return in JSON format:
      {
        "queries": ["query1"]
      }

      ### Chat History:
      <chat_history>
      {{MESSAGES:END:6}}
      </chat_history>
  # Hardening. Defaults are CORS_ALLOW_ORIGIN='*' and non-secure, lax cookies;
  # this instance is HTTPS-only behind Tailscale, so tighten all three.
  - name: CORS_ALLOW_ORIGIN
    value: "https://chat.home.jetzinger.com"
  - name: WEBUI_SESSION_COOKIE_SECURE
    value: "true"
  - name: WEBUI_SESSION_COOKIE_SAME_SITE
    value: "strict"

# Node selector - allow scheduling on any worker
nodeSelector: {}

# Tolerations
tolerations: []
