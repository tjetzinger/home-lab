---
# PostgreSQL cluster managed by CloudNativePG
# ADR-014: PostgreSQL off Bitnami
#
# Replaces the Bitnami postgresql chart in namespace `data`. See
# applications/postgres-cnpg/values-homelab.yaml for why.
#
# Bootstrap uses CNPG's declarative `monolith` import: the operator runs
# pg_dumpall -r (roles, with their password hashes) plus a pg_dump per named
# database against the live Bitnami instance. Nothing is copied by hand, and the
# three empty Epic-5 test databases (app_test_db, backup_test, test_persistence)
# are simply left off the list.
#
# The import runs ONCE, at bootstrap. To redo it, delete the Cluster and its PVC.
apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: postgres-cnpg
  namespace: data
  labels:
    app.kubernetes.io/name: postgres
    app.kubernetes.io/instance: postgres-cnpg
    app.kubernetes.io/component: database
    app.kubernetes.io/part-of: home-lab
    app.kubernetes.io/managed-by: kubectl
spec:
  # SINGLE INSTANCE - this is the known weak point, not an oversight.
  #
  # With one instance, draining either CPU worker is an outage: the PDB
  # (minAvailable 1) refuses the eviction, and Gitea, n8n, LiteLLM and Paperless all
  # go down with the database. That is exactly what happened during the k3s v1.34.11
  # upgrade on 2026-09-21 - 4m45s down, and n8n needed a further 121s and 9 retries
  # to reconnect afterwards.
  #
  # PLANNED FIX (researched 2026-09-21, not yet applied):
  #
  #   instances: 2
  #   affinity:
  #     enablePodAntiAffinity: true
  #     podAntiAffinityType: required   # currently "preferred"
  #
  # `required` is the part that matters. With "preferred" both instances could be
  # scheduled onto the same node and nothing would be gained; with two eligible nodes
  # and two instances, "required" puts exactly one on each.
  #
  # Assessed as low risk: the whole database is 159 MB, so the replica bootstraps by
  # streaming pg_basebackup from the primary in seconds. It needs one more 8Gi
  # nfs-client PVC, requests 100m CPU / 256Mi, and there are currently 0 replication
  # slots to disturb. primaryUpdateStrategy is already "unsupervised", so CNPG handles
  # switchover itself. Adding the replica needs no downtime - the primary keeps
  # serving while it catches up.
  #
  # Capacity note: k3s-worker-02 sits at 95% CPU requests and 83% memory requests
  # (k3s-worker-01 at 33% / 18%). The replica fits, but worker-02 has little headroom
  # for anything larger.
  #
  # What this does NOT provide: replication is not a backup - it copies mistakes
  # instantly, so the nightly pg_dump stays the thing that survives a bad DELETE. And
  # there is still no WAL archive to object storage (archive_mode is on but there is
  # no `backup:` block), so point-in-time recovery is not available. Separate work.
  #
  # Verify after raising this: `pg_stat_replication` on the primary shows a streaming
  # standby, and the PDB reports disruptionsAllowed: 1.
  instances: 1

  # Pinned. The whole point of this migration is that the data tier is never
  # again on a floating tag. Bump deliberately, same major as the data on disk.
  imageName: ghcr.io/cloudnative-pg/postgresql:18.6
  imagePullPolicy: IfNotPresent

  # LiteLLM connects as `postgres` (verified from its DATABASE_URL), so superuser
  # access cannot be disabled. Reusing the existing secret keeps every consumer's
  # password unchanged — only the host in their connection string moves.
  enableSuperuserAccess: true
  superuserSecret:
    name: postgres-cnpg-superuser

  storage:
    size: 8Gi
    storageClass: nfs-client

  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: 500m
      memory: 1Gi

  postgresql:
    parameters:
      # Conservative, matching the 1Gi limit above.
      shared_buffers: 128MB
      max_connections: "100"

  monitoring:
    enablePodMonitor: true

  bootstrap:
    initdb:
      import:
        type: monolith
        databases:
          - litellm
          - paperless
          - gitea
          - n8n
          - legacy_use
        roles:
          - "*"
        source:
          externalCluster: bitnami-postgres

  externalClusters:
    - name: bitnami-postgres
      connectionParameters:
        host: postgres-postgresql.data.svc.cluster.local
        user: postgres
        dbname: postgres
        sslmode: prefer
      password:
        name: postgres-cnpg-import-source
        key: password

  affinity:
    # Was `nodeSelector: kubernetes.io/hostname: k3s-worker-01` until 2026-09-21.
    # That pin was wrong: its own comment justified excluding two nodes, then pinned
    # to one, ignoring that k3s-master and k3s-worker-02 were both valid. It was also
    # redundant - taints already keep this pod off both excluded nodes. k3s-gpu-worker
    # carries gpu=true:NoSchedule and k3s-nas-worker carries
    # workload-type=lightweight:NoSchedule, and this pod tolerates neither (only
    # not-ready and unreachable).
    #
    # The pin cost a 4m45s outage during the k3s upgrade: the PDB (minAvailable 1 on a
    # single instance) refused the eviction, and once the pod was deleted it could not
    # reschedule anywhere - "2 node(s) didn't match Pod's node affinity/selector" - so
    # it stayed Pending until k3s-worker-01 was uncordoned.
    #
    # This affinity now keeps the database off the control plane while letting it move
    # between the two CPU workers, so either can be drained for maintenance.
    #
    # NOTE: with instances: 1 any move is still downtime. See the comment on
    # `instances` above for the planned two-instance fix.
    nodeAffinity:
      requiredDuringSchedulingIgnoredDuringExecution:
        nodeSelectorTerms:
          - matchExpressions:
              - key: kubernetes.io/hostname
                operator: In
                values:
                  - k3s-worker-01
                  - k3s-worker-02
