---
# PostgreSQL cluster managed by CloudNativePG
# ADR-014: PostgreSQL off Bitnami
#
# Replaces the Bitnami postgresql chart in namespace `data`. See
# applications/postgres-cnpg/values-homelab.yaml for why.
#
# Bootstrap uses CNPG's declarative `monolith` import: the operator runs
# pg_dumpall -r (roles, with their password hashes) plus a pg_dump per named
# database against the live Bitnami instance. Nothing is copied by hand, and the
# three empty Epic-5 test databases (app_test_db, backup_test, test_persistence)
# are simply left off the list.
#
# The import runs ONCE, at bootstrap. To redo it, delete the Cluster and its PVC.
apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: postgres-cnpg
  namespace: data
  labels:
    app.kubernetes.io/name: postgres
    app.kubernetes.io/instance: postgres-cnpg
    app.kubernetes.io/component: database
    app.kubernetes.io/part-of: home-lab
    app.kubernetes.io/managed-by: kubectl
spec:
  # TWO INSTANCES - primary plus one streaming replica, one per CPU worker.
  #
  # Raised from 1 on 2026-09-28. With a single instance, draining either CPU worker
  # was an outage: the primary's PodDisruptionBudget (minAvailable 1) refused the
  # eviction, and Gitea, n8n, LiteLLM and Paperless went down with the database. That
  # cost 4m45s during the k3s v1.34.11 upgrade on 2026-09-21, plus a further 121s and 9
  # retries for n8n to reconnect.
  #
  # With a replica, CNPG handles a drain itself (per its "Kubernetes upgrade and
  # maintenance" docs): "If a node is to be drained and contains a cluster's primary
  # instance, a switchover happens ahead of the drain." Downtime shrinks to one
  # switchover - NOT to zero.
  #
  # MEASURED during the rollout of this change, with a probe inserting a row every
  # second through postgres-cnpg-rw:
  #   - writes failed for 8 seconds (last row 09:06:15, next 09:06:24)
  #   - zero rows lost - the new primary held every row written to the old one
  #   - n8n reconnected after 4 attempts in 7s (was 9 attempts / 121s)
  #   - LiteLLM logged 43 errors, all inside that one minute, then recovered
  #
  # Only ONE PodDisruptionBudget exists, `postgres-cnpg-primary`, and it stays at
  # disruptionsAllowed: 0 BY DESIGN - that is what forces the switchover before
  # eviction. With a single replica CNPG creates no replica PDB (it could only block
  # everything or nothing). Do not read "0" as a problem.
  #
  # What this does NOT provide: replication is not a backup - it copies mistakes
  # instantly, so the nightly pg_dump stays the thing that survives a bad DELETE.
  #
  # NOR is there any WAL archive. pg_stat_archiver reports archived_count climbing with
  # failed_count 0, and that is MISLEADING: CNPG sets archive_mode=on and points
  # archive_command at its own wal-archive helper, but with no `backup:` block there is
  # no destination, so the command succeeds and the segment goes nowhere. Verified - no
  # wal-archive directory, nothing on the postgres-backup PVC, nothing in the logs.
  # It cannot be switched off either: archive_mode and archive_command are CNPG fixed
  # parameters, injected by the operator and rejected by its admission webhook
  # (cloudnative-pg#4053 proposed allowing it in 2024 and was never merged).
  # Read those counters as "archiving is configured", never as "PITR is available".
  #
  # Recovery granularity is therefore ONE DAY - the 02:00 pg_dump.
  # See docs/runbooks/postgres-backup.md for why neither barmanObjectStore nor
  # volumeSnapshot can be enabled as this cluster stands, and what would fix it.
  instances: 2

  # How CNPG updates the primary during a rolling update (a spec change, a Postgres
  # minor-version bump). The default `restart` restarts the primary IN PLACE - an
  # outage. `switchover` updates the replica first, then promotes it, so the primary
  # is only ever replaced by a switchover. Without this, raising the anti-affinity
  # below would itself have restarted the primary.
  primaryUpdateMethod: switchover

  # Pinned. The whole point of this migration is that the data tier is never
  # again on a floating tag. Bump deliberately, same major as the data on disk.
  imageName: ghcr.io/cloudnative-pg/postgresql:18.6
  imagePullPolicy: IfNotPresent

  # LiteLLM connects as `postgres` (verified from its DATABASE_URL), so superuser
  # access cannot be disabled. Reusing the existing secret keeps every consumer's
  # password unchanged — only the host in their connection string moves.
  enableSuperuserAccess: true
  superuserSecret:
    name: postgres-cnpg-superuser

  storage:
    size: 8Gi
    storageClass: nfs-client

  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: 500m
      memory: 1Gi

  postgresql:
    parameters:
      # Conservative, matching the 1Gi limit above.
      shared_buffers: 128MB
      max_connections: "100"

  monitoring:
    enablePodMonitor: true

  bootstrap:
    initdb:
      import:
        type: monolith
        databases:
          - litellm
          - paperless
          - gitea
          - n8n
          - legacy_use
        roles:
          - "*"
        source:
          externalCluster: bitnami-postgres

  externalClusters:
    - name: bitnami-postgres
      connectionParameters:
        host: postgres-postgresql.data.svc.cluster.local
        user: postgres
        dbname: postgres
        sslmode: prefer
      password:
        name: postgres-cnpg-import-source
        key: password

  affinity:
    # Was `nodeSelector: kubernetes.io/hostname: k3s-worker-01` until 2026-09-21.
    # That pin was wrong: its own comment justified excluding two nodes, then pinned
    # to one, ignoring that k3s-master and k3s-worker-02 were both valid. It was also
    # redundant - taints already keep this pod off both excluded nodes. k3s-gpu-worker
    # carries gpu=true:NoSchedule and k3s-nas-worker carries
    # workload-type=lightweight:NoSchedule, and this pod tolerates neither (only
    # not-ready and unreachable).
    #
    # The pin cost a 4m45s outage during the k3s upgrade: the PDB (minAvailable 1 on a
    # single instance) refused the eviction, and once the pod was deleted it could not
    # reschedule anywhere - "2 node(s) didn't match Pod's node affinity/selector" - so
    # it stayed Pending until k3s-worker-01 was uncordoned.
    #
    # This affinity now keeps the database off the control plane while letting it move
    # between the two CPU workers, so either can be drained for maintenance.
    #
    # Anti-affinity MUST be `required`, not the default `preferred`. With only two
    # eligible nodes, "preferred" lets a rescheduled instance land beside the other
    # one - after a drain of k3s-worker-01 the replica would move onto k3s-worker-02
    # and stay there. The next drain of k3s-worker-02 would then need to switch over to
    # a replica on the very node being drained. "required" instead leaves the displaced
    # instance Pending until its node returns, which is the correct behaviour.
    enablePodAntiAffinity: true
    podAntiAffinityType: required

    nodeAffinity:
      requiredDuringSchedulingIgnoredDuringExecution:
        nodeSelectorTerms:
          - matchExpressions:
              - key: kubernetes.io/hostname
                operator: In
                values:
                  - k3s-worker-01
                  - k3s-worker-02
