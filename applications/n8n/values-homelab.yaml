# n8n Helm values for home-lab
# Story: 6.3 - Deploy n8n for Workflow Automation
# Epic: 6 - AI Inference Platform
# Chart: community-charts/n8n
#
# FRs:
# - FR8: Deploy applications using Helm charts
# - FR40: Deploy n8n for workflow automation

# Override service/deployment name to avoid K8s service discovery injecting
# N8N_PORT=tcp://... which breaks n8n's own N8N_PORT config.
fullnameOverride: n8n-app

# Image configuration
image:
  repository: n8nio/n8n
  pullPolicy: IfNotPresent
  # Pinned 2026-09-21 (Phase 4). Was empty, which let whichever chart happened to be
  # installed decide the running version - the drift Phase 3 removed elsewhere.
  #
  # 2.3.5 -> 2.39.8, 36 minor versions. n8n's own BREAKING-CHANGES.md lists nothing
  # newer than 2.0.0, and that entry only affects the `n8nio/runners` task-runner
  # image, which is not used here. The real risk is the schema migration, which runs
  # on first start and is not undone by changing this tag back; a full dump was taken
  # immediately before (postgres-backup-2026-09-21-132528.sql.gz).
  #
  # 2.39.8 is the chart's own appVersion. `stable` moved to 2.39.9 earlier today -
  # deliberately not taken, to avoid pairing a hours-old release with a 36-version
  # migration. The `beta` channel is 2.40.x; do not follow it.
  tag: "2.39.8"

# Deployment strategy
strategy:
  type: Recreate  # Single instance with persistent data

# Pod labels
podLabels:
  app.kubernetes.io/name: n8n
  app.kubernetes.io/instance: n8n
  app.kubernetes.io/part-of: home-lab

# Security context
podSecurityContext:
  fsGroup: 1000
  fsGroupChangePolicy: "OnRootMismatch"

securityContext:
  allowPrivilegeEscalation: false
  capabilities:
    drop:
      - ALL
  readOnlyRootFilesystem: false
  runAsNonRoot: true
  privileged: false
  runAsUser: 1000
  runAsGroup: 1000

# Service configuration
service:
  enabled: true
  type: ClusterIP
  port: 5678
  name: http

# Timezone configuration
timezone: "America/New_York"

# Security encryption key stored in secrets/n8n-secrets.yaml (gitignored) as the
# `encryptionKey` value. That file is a Helm values overlay, not a K8s Secret manifest;
# the chart turns it into secret `n8n-app-encryption-key-secret-v2` in namespace `apps`.
#
# This is the single most important value in this deployment: lose it and all stored
# credentials become permanently undecryptable. Verify the backup still matches the
# running pod BEFORE any upgrade:
#   diff <(yq .encryptionKey secrets/n8n-secrets.yaml) \
#        <(kubectl --context default exec -n apps deploy/n8n-app -- printenv N8N_ENCRYPTION_KEY)
# Confirmed matching through the 2.3.5 -> 2.39.8 upgrade on 2026-09-21.
#
# Deployment: ./scripts/deploy-n8n.sh (auto-merges secrets)

# External PostgreSQL — connection configured via extraEnvVars below.
# Password stored in secrets/n8n-secrets.yaml (gitignored).

# Main node configuration
main:
  # Resource limits
  resources:
    requests:
      cpu: 250m
      memory: 512Mi
    limits:
      cpu: 2000m
      memory: 2Gi

  # Persistent storage for n8n data
  persistence:
    enabled: true
    storageClass: nfs-client
    accessMode: ReadWriteOnce
    size: 10Gi
    mountPath: /home/node/.n8n
    annotations:
      helm.sh/resource-policy: keep

  # Health checks
  livenessProbe:
    httpGet:
      path: /healthz
      port: http
    initialDelaySeconds: 30
    periodSeconds: 10
    timeoutSeconds: 5
    failureThreshold: 3

  readinessProbe:
    httpGet:
      path: /healthz/readiness
      port: http
    initialDelaySeconds: 15
    periodSeconds: 5
    timeoutSeconds: 3
    failureThreshold: 3

  # Environment variables for n8n
  # DB_POSTGRESDB_PASSWORD is in secrets/n8n-secrets.yaml (gitignored).
  extraEnvVars:
    N8N_PROTOCOL: "https"
    N8N_HOST: "n8n.home.jetzinger.com"
    WEBHOOK_URL: "https://n8n.home.jetzinger.com/"

    # Database configuration
    DB_TYPE: "postgresdb"
    # CloudNativePG (ADR-014). Was postgres-postgresql.data until 2026-09-20 —
    # Bitnami removed all versioned tags from Docker Hub, leaving the data tier
    # unpinnable. `-rw` is the CNPG primary service.
    DB_POSTGRESDB_HOST: "postgres-cnpg-rw.data.svc.cluster.local"
    DB_POSTGRESDB_PORT: "5432"
    DB_POSTGRESDB_DATABASE: "n8n"
    DB_POSTGRESDB_USER: "n8n"
    DB_POSTGRESDB_SCHEMA: "public"
    DB_POSTGRESDB_POOL_SIZE: "2"
    DB_POSTGRESDB_CONNECTION_TIMEOUT: "20000"
    DB_POSTGRESDB_IDLE_TIMEOUT: "30000"

    # Execution settings
    EXECUTIONS_MODE: "regular"
    EXECUTIONS_DATA_PRUNE: "true"
    EXECUTIONS_DATA_MAX_AGE: "336"  # 14 days

# Disable embedded PostgreSQL (using external)
postgresql:
  enabled: false

# Disable embedded Redis (not needed for simple setup)
redis:
  enabled: false

# Disable MinIO (not needed)
minio:
  enabled: false
