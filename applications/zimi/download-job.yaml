# Zimi ZIM download Job
# ADR-023 - Seeds the library: every ZIM installed as of 2026-11-24 (~215GB), so a lost library
# volume comes back the same. EN + DE Wikipedia were the initial load; the rest Tom added through
# Zimi's Manage pages and were copied here afterwards.
#
# Zimi auto-updates the library daily (Manage setting, /config/auto_update.json), so the files on
# disk move ahead of the names below. That is fine: a ZIM counts as present when ANY dump of it is
# there (same name, any date), so a re-run never fetches an older dump over a newer one.
# To add a ZIM here, find its directory on https://download.kiwix.org/zim/ (community/ and
# videos/ included) and add "dir/file.zim".
#
# Why a Job instead of Zimi's own catalog downloader: it is in git, it resumes (curl -C -), and it
# verifies Kiwix's published sha256 before a file becomes visible to Zimi. A .zim appears in
# /zims only after its checksum matches; until then it is a .part file Zimi ignores.
#
# Runs on k3s-nas-worker next to Zimi, so the data goes internet -> NAS VM -> Synology without a
# second LAN hop. Idempotent: a finished, verified file is skipped on re-run.
#
# Re-run (recovery, or after adding entries): edit FILES, then
#   kubectl delete job zimi-download -n docs --ignore-not-found
#   kubectl apply -f applications/zimi/download-job.yaml
# Zimi registers files from outside its own downloader only at startup, so afterwards:
#   kubectl rollout restart deployment/zimi -n docs
apiVersion: batch/v1
kind: Job
metadata:
  name: zimi-download
  namespace: docs
  labels:
    app.kubernetes.io/name: zimi
    app.kubernetes.io/instance: zimi-download
    app.kubernetes.io/part-of: home-lab
    app.kubernetes.io/managed-by: kubectl
spec:
  backoffLimit: 6  # each retry resumes where the last one stopped
  ttlSecondsAfterFinished: 604800
  template:
    metadata:
      labels:
        app.kubernetes.io/name: zimi
        app.kubernetes.io/instance: zimi-download
        app.kubernetes.io/part-of: home-lab
    spec:
      restartPolicy: Never
      enableServiceLinks: false
      nodeSelector:
        kubernetes.io/hostname: k3s-nas-worker
      tolerations:
        - key: workload-type
          operator: Equal
          value: lightweight
          effect: NoSchedule
      securityContext:
        runAsUser: 1000
        runAsGroup: 1000
        runAsNonRoot: true
      containers:
        - name: download
          image: curlimages/curl:8.23.0
          env:
            - name: BASE_URL
              value: https://download.kiwix.org/zim
            # "dir/file.zim", one per line. Smallest last is not required: each file is independent.
            - name: FILES
              value: |
                wikipedia/wikipedia_de_all_maxi_2026-10.zim
                wikipedia/wikipedia_en_all_maxi_2026-08.zim
                community/gutenberg_en_top_2026-11.zim
                maps/maps_en_europe_2026-08.zim
                other/mdwiki_en_all_maxi_2025-11.zim
                zimit/medlineplus.gov_en_all_2025-01.zim
                videos/quickguidesformedicine_en_all_2026-06.zim
                zimit/wwwnc.cdc.gov_en_all_2024-11.zim
                community/sermonindex.net_en_bible_2026-10.zim
                stack_exchange/writing.stackexchange.com_en_all_2026-10.zim
                other/librepathology_en_all_maxi_2026-09.zim
                stack_exchange/pets.stackexchange.com_en_all_2026-10.zim
                other/zimgit-medicine_en_2024-08.zim
                zimit/irp.fas.org_en_military-medicine_2026-10.zim
                zimit/nhs.uk_en_medicines_2026-09b.zim
          command: ["/bin/sh", "-ec"]
          args:
            - |
              cd /zims
              for entry in $FILES; do
                f=${entry##*/}
                # wikipedia_en_all_maxi_2026-08.zim -> wikipedia_en_all_maxi: any dump of it counts
                base=${f%.zim}; base=${base%_*}
                present=$(ls "${base}"_*.zim 2>/dev/null | head -1 || true)
                if [ -n "$present" ]; then echo "$f: $present present, skipping"; continue; fi
                echo "$f: downloading (resumes a .part if one exists)"
                curl -fL --retry 10 --retry-delay 30 --retry-all-errors -C - -o "$f.part" "$BASE_URL/$entry"
                want=$(curl -fsSL "$BASE_URL/$entry.sha256" | cut -d' ' -f1)
                echo "$f: verifying sha256"
                got=$(sha256sum "$f.part" | cut -d' ' -f1)
                if [ "$want" != "$got" ]; then
                  echo "$f: CHECKSUM MISMATCH want=$want got=$got - removing .part" >&2
                  rm -f "$f.part"
                  exit 1
                fi
                mv "$f.part" "$f"
                echo "$f: verified and in place"
              done
              ls -la /zims
          volumeMounts:
            - name: library
              mountPath: /zims
          resources:
            requests:
              cpu: 100m
              memory: 64Mi
            limits:
              cpu: "1"
              memory: 256Mi
      volumes:
        - name: library
          persistentVolumeClaim:
            claimName: zimi-library
