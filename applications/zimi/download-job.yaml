# Zimi ZIM download Job
# ADR-023 - Loads the initial library: English + German Wikipedia with images (~176GB)
#
# Why a Job instead of Zimi's own catalog downloader: it is in git, it resumes (curl -C -), and it
# verifies Kiwix's published sha256 before a file becomes visible to Zimi. A .zim appears in
# /zims only after its checksum matches; until then it is a .part file Zimi ignores.
#
# Runs on k3s-nas-worker next to Zimi, so the data goes internet -> NAS VM -> Synology without a
# second LAN hop. Idempotent: a finished, verified file is skipped on re-run.
#
# Re-run (e.g. for a new dump): edit FILES, then
#   kubectl delete job zimi-download -n docs --ignore-not-found
#   kubectl apply -f applications/zimi/download-job.yaml
# Zimi picks up new files on its own; old dumps are removed by hand after the new one is in.
apiVersion: batch/v1
kind: Job
metadata:
  name: zimi-download
  namespace: docs
  labels:
    app.kubernetes.io/name: zimi
    app.kubernetes.io/instance: zimi-download
    app.kubernetes.io/part-of: home-lab
    app.kubernetes.io/managed-by: kubectl
spec:
  backoffLimit: 6  # each retry resumes where the last one stopped
  ttlSecondsAfterFinished: 604800
  template:
    metadata:
      labels:
        app.kubernetes.io/name: zimi
        app.kubernetes.io/instance: zimi-download
        app.kubernetes.io/part-of: home-lab
    spec:
      restartPolicy: Never
      enableServiceLinks: false
      nodeSelector:
        kubernetes.io/hostname: k3s-nas-worker
      tolerations:
        - key: workload-type
          operator: Equal
          value: lightweight
          effect: NoSchedule
      securityContext:
        runAsUser: 1000
        runAsGroup: 1000
        runAsNonRoot: true
      containers:
        - name: download
          image: curlimages/curl:8.23.0
          env:
            - name: BASE_URL
              value: https://download.kiwix.org/zim/wikipedia
            - name: FILES
              value: wikipedia_de_all_maxi_2026-10.zim wikipedia_en_all_maxi_2026-08.zim
          command: ["/bin/sh", "-ec"]
          args:
            - |
              cd /zims
              for f in $FILES; do
                if [ -f "$f" ]; then echo "$f: present, skipping"; continue; fi
                echo "$f: downloading (resumes a .part if one exists)"
                curl -fL --retry 10 --retry-delay 30 --retry-all-errors -C - -o "$f.part" "$BASE_URL/$f"
                want=$(curl -fsSL "$BASE_URL/$f.sha256" | cut -d' ' -f1)
                echo "$f: verifying sha256"
                got=$(sha256sum "$f.part" | cut -d' ' -f1)
                if [ "$want" != "$got" ]; then
                  echo "$f: CHECKSUM MISMATCH want=$want got=$got - removing .part" >&2
                  rm -f "$f.part"
                  exit 1
                fi
                mv "$f.part" "$f"
                echo "$f: verified and in place"
              done
              ls -la /zims
          volumeMounts:
            - name: library
              mountPath: /zims
          resources:
            requests:
              cpu: 100m
              memory: 64Mi
            limits:
              cpu: "1"
              memory: 256Mi
      volumes:
        - name: library
          persistentVolumeClaim:
            claimName: zimi-library
