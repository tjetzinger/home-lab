# Gitea Helm values for home-lab
# Story: 19.1 - Deploy Gitea with PostgreSQL Backend
# Epic: 19 - Self-Hosted Git Service (Gitea)
# Chart: gitea-charts/gitea
#
# FRs:
# - FR134: Gitea deployed in dev namespace with PostgreSQL backend
# - FR137: Gitea configured for single-user operation with SSH key authentication
#
# NFRs:
# - NFR79: Repository operations complete within 10 seconds
# - NFR80: Gitea web interface loads within 3 seconds

# Pod labels
podLabels:
  app.kubernetes.io/name: gitea
  app.kubernetes.io/instance: gitea
  app.kubernetes.io/part-of: home-lab

# Image configuration
#
# Tag pinned explicitly 2026-09-21 (Phase 4). The chart's appVersion trails the
# application: chart 12.7.0 ships 1.27.0 while upstream is at 1.27.3. Leaving the tag
# unset means the running version is decided by whichever chart happens to be
# installed. Bump this line to upgrade, not the chart.
#
# 1.24.6 -> 1.27.3 crosses three minor versions and migrates the schema on first
# start, which a tag rollback does not undo. A full dump was taken immediately before.
# Every BREAKING entry in 1.25/1.26/1.27 lands in Actions or API surfaces unused here:
# no [actions] section, 0 action_runners, and Gitea is not scraped by Prometheus so
# the 1.25 `gitea_users` metric label change is irrelevant. 1.26 changes
# PUBLIC_URL_DETECTION to "auto", which is harmless because ROOT_URL is set below.
image:
  rootless: true
  tag: "1.27.3"

# Deployment configuration
replicaCount: 1

# Service configuration
service:
  http:
    type: ClusterIP
    port: 3000
  ssh:
    type: ClusterIP  # Routed via Traefik IngressRouteTCP (FR137)
    port: 2222       # Non-privileged port for SSH

# Deployment strategy — MUST be Recreate.
#
# The chart defaults to RollingUpdate with maxSurge 100%/maxUnavailable 0, which starts
# the new pod before terminating the old one. Gitea's data lives on a single RWO PVC
# (gitea-shared-storage) and it takes a LevelDB lock on /data/queues/common, so the new
# pod dies with:
#   Failed to create queue "notification-service": unable to lock level db at
#   /data/queues/common: resource temporarily unavailable
#
# Every upgrade hit this; it only appeared to work when the deployment happened to be
# scaled to 0 beforehand. Found 2026-09-21 during the admin password rotation.
strategy:
  type: Recreate
  rollingUpdate: null

# Gitea configuration
gitea:
  admin:
    # Credentials come from secret `gitea-admin-secret` in namespace `dev`, NOT from
    # this file. The password was previously inline here as plaintext and had been
    # committed to a public repo since 54ad709 (2026-01-15). Rotated 2026-09-21; see
    # docs/runbooks/secret-rotation.md. The old value is still reachable in git history
    # and on GitHub by SHA, which is why rotation — not just removal — was required.
    #
    # Apply the real value with `kubectl patch`, never `kubectl apply` on a placeholder:
    #   kubectl patch secret gitea-admin-secret -n dev --type=merge \
    #     -p '{"stringData":{"password":"<value>"}}'
    existingSecret: gitea-admin-secret
    passwordMode: keepUpdated

  # Database password, injected as an env var rather than written into app.ini by the
  # chart. GITEA__<section>__<KEY> is Gitea's own config-from-environment convention.
  additionalConfigFromEnvs:
    - name: GITEA__database__PASSWD
      valueFrom:
        secretKeyRef:
          name: gitea-db-secret
          key: password

  config:
    server:
      DOMAIN: git.home.jetzinger.com
      ROOT_URL: https://git.home.jetzinger.com/
      SSH_DOMAIN: git.home.jetzinger.com
      SSH_PORT: 2222  # Must match service.ssh.port for clone URLs
      LFS_START_SERVER: true

    database:
      DB_TYPE: postgres
      # CloudNativePG (ADR-014). Was postgres-postgresql.data.svc.cluster.local
      # until 2026-09-20 — Bitnami removed all versioned tags from Docker Hub.
      HOST: postgres-cnpg-rw.data.svc.cluster.local:5432
      NAME: gitea
      USER: gitea
      # PASSWD deliberately absent. It is injected as GITEA__database__PASSWD from
      # secret `gitea-db-secret` in namespace `dev` — see additionalConfigFromEnvs
      # below, and applications/gitea/db-secret.yaml for the placeholder template.
      #
      # It was inline here as a plaintext `PASSWD:` value and had been committed to a
      # public repo. Rotated 2026-09-21; the old value stays reachable in git history
      # and on GitHub by SHA, which is why rotation was required, not just removal.
      # Same treatment as the admin password earlier the same day.

    repository:
      DEFAULT_BRANCH: main

    service:
      DISABLE_REGISTRATION: true
      REQUIRE_SIGNIN_VIEW: true

    log:
      LEVEL: Info
      MODE: console

    cache:
      ADAPTER: memory

    session:
      PROVIDER: memory

    queue:
      TYPE: level

# Persistence configuration (FR136)
persistence:
  enabled: true
  storageClass: nfs-client
  accessModes:
    - ReadWriteOnce
  size: 10Gi
  annotations:
    helm.sh/resource-policy: keep

# Resource limits (aligned with NFR80 - fast interface)
resources:
  requests:
    cpu: 100m
    memory: 256Mi
  limits:
    cpu: 500m
    memory: 512Mi

# Disable embedded PostgreSQL (using external)
postgresql:
  enabled: false

# Disable embedded PostgreSQL-HA
postgresql-ha:
  enabled: false

# Disable embedded Redis/Valkey (using memory cache)
redis-cluster:
  enabled: false

valkey-cluster:
  enabled: false

# Disable Memcached
memcached:
  enabled: false

# Init container configuration
initContainers:
  resources:
    requests:
      cpu: 50m
      memory: 64Mi
    limits:
      cpu: 100m
      memory: 128Mi

# Security context for rootless
podSecurityContext:
  fsGroup: 1000

containerSecurityContext:
  allowPrivilegeEscalation: false
  capabilities:
    drop:
      - ALL
  privileged: false
  readOnlyRootFilesystem: false
  runAsNonRoot: true
  runAsUser: 1000
  runAsGroup: 1000
