# Gitea Helm values for home-lab
# Story: 19.1 - Deploy Gitea with PostgreSQL Backend
# Epic: 19 - Self-Hosted Git Service (Gitea)
# Chart: gitea-charts/gitea
#
# FRs:
# - FR134: Gitea deployed in dev namespace with PostgreSQL backend
# - FR137: Gitea configured for single-user operation with SSH key authentication
#
# NFRs:
# - NFR79: Repository operations complete within 10 seconds
# - NFR80: Gitea web interface loads within 3 seconds

# Pod labels
podLabels:
  app.kubernetes.io/name: gitea
  app.kubernetes.io/instance: gitea
  app.kubernetes.io/part-of: home-lab

# Image configuration
image:
  rootless: true

# Deployment configuration
replicaCount: 1

# Service configuration
service:
  http:
    type: ClusterIP
    port: 3000
  ssh:
    type: ClusterIP  # Routed via Traefik IngressRouteTCP (FR137)
    port: 2222       # Non-privileged port for SSH

# Deployment strategy — MUST be Recreate.
#
# The chart defaults to RollingUpdate with maxSurge 100%/maxUnavailable 0, which starts
# the new pod before terminating the old one. Gitea's data lives on a single RWO PVC
# (gitea-shared-storage) and it takes a LevelDB lock on /data/queues/common, so the new
# pod dies with:
#   Failed to create queue "notification-service": unable to lock level db at
#   /data/queues/common: resource temporarily unavailable
#
# Every upgrade hit this; it only appeared to work when the deployment happened to be
# scaled to 0 beforehand. Found 2026-09-21 during the admin password rotation.
strategy:
  type: Recreate
  rollingUpdate: null

# Gitea configuration
gitea:
  admin:
    # Credentials come from secret `gitea-admin-secret` in namespace `dev`, NOT from
    # this file. The password was previously inline here as plaintext and had been
    # committed to a public repo since 54ad709 (2026-01-15). Rotated 2026-09-21; see
    # docs/runbooks/secret-rotation.md. The old value is still reachable in git history
    # and on GitHub by SHA, which is why rotation — not just removal — was required.
    #
    # Apply the real value with `kubectl patch`, never `kubectl apply` on a placeholder:
    #   kubectl patch secret gitea-admin-secret -n dev --type=merge \
    #     -p '{"stringData":{"password":"<value>"}}'
    existingSecret: gitea-admin-secret
    passwordMode: keepUpdated

  config:
    server:
      DOMAIN: git.home.jetzinger.com
      ROOT_URL: https://git.home.jetzinger.com/
      SSH_DOMAIN: git.home.jetzinger.com
      SSH_PORT: 2222  # Must match service.ssh.port for clone URLs
      LFS_START_SERVER: true

    database:
      DB_TYPE: postgres
      # CloudNativePG (ADR-014). Was postgres-postgresql.data.svc.cluster.local
      # until 2026-09-20 — Bitnami removed all versioned tags from Docker Hub.
      HOST: postgres-cnpg-rw.data.svc.cluster.local:5432
      NAME: gitea
      USER: gitea
      PASSWD: gitea-homelab-2026

    repository:
      DEFAULT_BRANCH: main

    service:
      DISABLE_REGISTRATION: true
      REQUIRE_SIGNIN_VIEW: true

    log:
      LEVEL: Info
      MODE: console

    cache:
      ADAPTER: memory

    session:
      PROVIDER: memory

    queue:
      TYPE: level

# Persistence configuration (FR136)
persistence:
  enabled: true
  storageClass: nfs-client
  accessModes:
    - ReadWriteOnce
  size: 10Gi
  annotations:
    helm.sh/resource-policy: keep

# Resource limits (aligned with NFR80 - fast interface)
resources:
  requests:
    cpu: 100m
    memory: 256Mi
  limits:
    cpu: 500m
    memory: 512Mi

# Disable embedded PostgreSQL (using external)
postgresql:
  enabled: false

# Disable embedded PostgreSQL-HA
postgresql-ha:
  enabled: false

# Disable embedded Redis/Valkey (using memory cache)
redis-cluster:
  enabled: false

valkey-cluster:
  enabled: false

# Disable Memcached
memcached:
  enabled: false

# Init container configuration
initContainers:
  resources:
    requests:
      cpu: 50m
      memory: 64Mi
    limits:
      cpu: 100m
      memory: 128Mi

# Security context for rootless
podSecurityContext:
  fsGroup: 1000

containerSecurityContext:
  allowPrivilegeEscalation: false
  capabilities:
    drop:
      - ALL
  privileged: false
  readOnlyRootFilesystem: false
  runAsNonRoot: true
  runAsUser: 1000
  runAsGroup: 1000
