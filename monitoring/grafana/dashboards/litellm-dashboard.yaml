            "overrides": []
          },
          "options": {
            "legend": {
              "displayMode": "table",
              "placement": "right",
              "showLegend": true,
              "calcs": [
                "max",
                "mean",
                "lastNotNull"
              ]
            },
            "tooltip": {
              "mode": "multi",
              "sort": "none"
            }
          }
        }
      ],
      "refresh": "30s",
      "schemaVersion": 30,
      "style": "dark",
      "tags": [
