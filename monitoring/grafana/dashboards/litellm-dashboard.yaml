apiVersion: v1
kind: ConfigMap
metadata:
  name: litellm-dashboard
  namespace: monitoring
  labels:
    app: kube-prometheus-stack-grafana
    app.kubernetes.io/instance: kube-prometheus-stack
    app.kubernetes.io/part-of: home-lab
    grafana_dashboard: '1'
    release: kube-prometheus-stack
data:
  litellm-dashboard.json: |-
    {
      "annotations": {
        "list": [
          {
            "builtIn": 1,
            "datasource": "-- Grafana --",
            "enable": true,
            "hide": true,
            "iconColor": "rgba(0, 211, 255, 1)",
            "name": "Annotations & Alerts",
            "type": "dashboard"
          }
        ]
      },
      "description": "LiteLLM Inference Proxy Metrics - Request rates, latencies, and model usage",
      "editable": true,
      "gnetId": null,
      "graphTooltip": 0,
      "id": null,
      "links": [],
      "panels": [
        {
          "datasource": "Prometheus",
          "fieldConfig": {
            "defaults": {
              "color": {
                "mode": "palette-classic"
              },
              "mappings": [],
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "green",
                    "value": null
                  }
                ]
              },
              "unit": "reqps"
            },
            "overrides": []
          },
          "gridPos": {
            "h": 4,
            "w": 6,
            "x": 0,
            "y": 0
          },
          "id": 1,
          "options": {
            "colorMode": "value",
            "graphMode": "area",
            "justifyMode": "auto",
            "orientation": "auto",
            "reduceOptions": {
              "calcs": [
                "lastNotNull"
              ],
              "fields": "",
              "values": false
            },
            "textMode": "auto"
          },
          "pluginVersion": "9.5.0",
          "targets": [
            {
              "expr": "rate(litellm_proxy_total_requests_metric_total{job=\"litellm\"}[5m])",
              "legendFormat": "Requests/sec",
              "refId": "A"
            }
          ],
          "title": "Request Rate",
          "type": "stat"
        },
        {
          "datasource": "Prometheus",
          "fieldConfig": {
            "defaults": {
              "color": {
                "mode": "palette-classic"
              },
              "mappings": [],
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "green",
                    "value": null
                  },
                  {
                    "color": "red",
                    "value": 1
                  }
                ]
              },
              "unit": "short"
            },
            "overrides": []
          },
          "gridPos": {
            "h": 4,
            "w": 6,
            "x": 6,
            "y": 0
          },
          "id": 2,
          "options": {
            "colorMode": "value",
            "graphMode": "area",
            "justifyMode": "auto",
            "orientation": "auto",
            "reduceOptions": {
              "calcs": [
                "lastNotNull"
              ],
              "fields": "",
              "values": false
            },
            "textMode": "auto"
          },
          "pluginVersion": "9.5.0",
          "targets": [
            {
              "expr": "increase(litellm_proxy_failed_requests_metric_total{job=\"litellm\"}[1h])",
              "legendFormat": "Failed Requests (1h)",
              "refId": "A"
            }
          ],
          "title": "Failed Requests (1h)",
          "type": "stat"
        },
        {
          "datasource": "Prometheus",
          "fieldConfig": {
            "defaults": {
              "color": {
                "mode": "palette-classic"
              },
              "mappings": [],
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "green",
                    "value": null
                  }
                ]
              },
              "unit": "short"
            },
            "overrides": []
          },
          "gridPos": {
            "h": 4,
            "w": 6,
            "x": 12,
            "y": 0
          },
          "id": 3,
          "options": {
            "colorMode": "value",
            "graphMode": "area",
            "justifyMode": "auto",
            "orientation": "auto",
            "reduceOptions": {
              "calcs": [
                "lastNotNull"
              ],
              "fields": "",
              "values": false
            },
            "textMode": "auto"
          },
          "pluginVersion": "9.5.0",
          "targets": [
            {
              "expr": "sum(increase(litellm_total_tokens_metric_total{job=\"litellm\"}[1h]))",
              "legendFormat": "Tokens (1h)",
              "refId": "A"
            }
          ],
          "title": "Total Tokens (1h)",
          "type": "stat"
        },
        {
          "datasource": "Prometheus",
          "fieldConfig": {
            "defaults": {
              "color": {
                "mode": "palette-classic"
              },
              "mappings": [],
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "green",
                    "value": null
                  }
                ]
              },
              "unit": "currencyUSD"
            },
            "overrides": []
          },
          "gridPos": {
            "h": 4,
            "w": 6,
            "x": 18,
            "y": 0
          },
          "id": 4,
          "options": {
            "colorMode": "value",
            "graphMode": "area",
            "justifyMode": "auto",
            "orientation": "auto",
            "reduceOptions": {
              "calcs": [
                "lastNotNull"
              ],
              "fields": "",
              "values": false
            },
            "textMode": "auto"
          },
          "pluginVersion": "9.5.0",
          "targets": [
            {
              "expr": "sum(litellm_spend_metric_total{job=\"litellm\"})",
              "legendFormat": "Total Spend",
              "refId": "A"
            }
          ],
          "title": "Total Spend",
          "type": "stat"
        },
        {
          "datasource": "Prometheus",
          "gridPos": {
            "h": 8,
            "w": 12,
            "x": 0,
            "y": 4
          },
          "id": 5,
          "targets": [
            {
              "expr": "sum by (requested_model) (rate(litellm_proxy_total_requests_metric_total{job=\"litellm\"}[5m]))",
              "legendFormat": "{{requested_model}}",
              "refId": "A"
            }
          ],
          "timeFrom": null,
          "timeShift": null,
          "title": "Request Rate by Model",
          "type": "timeseries",
          "fieldConfig": {
            "defaults": {
              "custom": {
                "drawStyle": "line",
                "lineInterpolation": "linear",
                "lineWidth": 2,
                "fillOpacity": 10,
                "showPoints": "auto",
                "pointSize": 2,
                "spanNulls": false
              },
              "unit": "reqps",
              "min": 0.0
            },
            "overrides": []
          },
          "options": {
            "legend": {
              "displayMode": "table",
              "placement": "right",
              "showLegend": true,
              "calcs": [
                "max",
                "mean",
                "lastNotNull"
              ]
            },
            "tooltip": {
              "mode": "multi",
              "sort": "none"
            }
          }
        },
        {
          "datasource": "Prometheus",
          "gridPos": {
            "h": 8,
            "w": 12,
            "x": 12,
            "y": 4
          },
          "id": 6,
          "targets": [
            {
              "expr": "histogram_quantile(0.50, rate(litellm_request_total_latency_metric_bucket{job=\"litellm\"}[5m]))",
              "legendFormat": "p50",
              "refId": "A"
            },
            {
              "expr": "histogram_quantile(0.95, rate(litellm_request_total_latency_metric_bucket{job=\"litellm\"}[5m]))",
              "legendFormat": "p95",
              "refId": "B"
            },
            {
              "expr": "histogram_quantile(0.99, rate(litellm_request_total_latency_metric_bucket{job=\"litellm\"}[5m]))",
              "legendFormat": "p99",
              "refId": "C"
            }
          ],
          "timeFrom": null,
          "timeShift": null,
          "title": "Request Latency Percentiles",
          "type": "timeseries",
          "fieldConfig": {
            "defaults": {
              "custom": {
                "drawStyle": "line",
                "lineInterpolation": "linear",
                "lineWidth": 2,
                "fillOpacity": 10,
                "showPoints": "auto",
                "pointSize": 2,
                "spanNulls": false
              },
              "unit": "s",
              "min": 0.0
            },
            "overrides": []
          },
          "options": {
            "legend": {
              "displayMode": "table",
              "placement": "right",
              "showLegend": true,
              "calcs": [
                "max",
                "mean",
                "lastNotNull"
              ]
            },
            "tooltip": {
              "mode": "multi",
              "sort": "none"
            }
          }
        },
        {
          "datasource": "Prometheus",
          "gridPos": {
            "h": 8,
            "w": 12,
            "x": 0,
            "y": 12
          },
          "id": 7,
          "targets": [
            {
              "expr": "rate(litellm_input_tokens_metric_total{job=\"litellm\"}[5m])",
              "legendFormat": "Input Tokens",
              "refId": "A"
            },
            {
              "expr": "rate(litellm_output_tokens_metric_total{job=\"litellm\"}[5m])",
              "legendFormat": "Output Tokens",
              "refId": "B"
            }
          ],
          "timeFrom": null,
          "timeShift": null,
          "title": "Token Throughput",
          "type": "timeseries",
          "fieldConfig": {
            "defaults": {
              "custom": {
                "drawStyle": "line",
                "lineInterpolation": "linear",
                "lineWidth": 2,
                "fillOpacity": 10,
                "showPoints": "auto",
                "pointSize": 2,
                "spanNulls": false,
                "stacking": {
                  "mode": "normal",
                  "group": "A"
                }
              },
              "min": 0.0
            },
            "overrides": []
          },
          "options": {
            "legend": {
              "displayMode": "table",
              "placement": "right",
              "showLegend": true,
              "calcs": [
                "max",
                "mean",
                "lastNotNull"
              ]
            },
            "tooltip": {
              "mode": "multi",
              "sort": "none"
            }
          }
        },
        {
          "datasource": "Prometheus",
          "gridPos": {
            "h": 8,
            "w": 12,
            "x": 12,
            "y": 12
          },
          "id": 8,
          "targets": [
            {
              "expr": "histogram_quantile(0.50, sum by (le, requested_model) (rate(litellm_llm_api_latency_metric_bucket{job=\"litellm\"}[5m])))",
              "legendFormat": "{{requested_model}} p50",
              "refId": "A"
            },
            {
              "expr": "histogram_quantile(0.95, sum by (le, requested_model) (rate(litellm_llm_api_latency_metric_bucket{job=\"litellm\"}[5m])))",
              "legendFormat": "{{requested_model}} p95",
              "refId": "B"
            }
          ],
          "timeFrom": null,
          "timeShift": null,
          "title": "LLM API Latency by Model",
          "type": "timeseries",
          "fieldConfig": {
            "defaults": {
              "custom": {
                "drawStyle": "line",
                "lineInterpolation": "linear",
                "lineWidth": 2,
                "fillOpacity": 10,
                "showPoints": "auto",
                "pointSize": 2,
                "spanNulls": false
              },
              "unit": "s",
              "min": 0.0
            },
            "overrides": []
          },
          "options": {
            "legend": {
              "displayMode": "table",
              "placement": "right",
              "showLegend": true,
              "calcs": [
                "max",
                "mean",
                "lastNotNull"
              ]
            },
            "tooltip": {
              "mode": "multi",
              "sort": "none"
            }
          }
        },
        {
          "datasource": "Prometheus",
          "gridPos": {
            "h": 8,
            "w": 24,
            "x": 0,
            "y": 20
          },
          "id": 9,
          "targets": [
            {
              "expr": "histogram_quantile(0.50, rate(litellm_overhead_latency_metric_bucket{job=\"litellm\"}[5m]))",
              "legendFormat": "Overhead p50",
              "refId": "A"
            },
            {
              "expr": "histogram_quantile(0.95, rate(litellm_overhead_latency_metric_bucket{job=\"litellm\"}[5m]))",
              "legendFormat": "Overhead p95",
              "refId": "B"
            }
          ],
          "timeFrom": null,
          "timeShift": null,
          "title": "LiteLLM Proxy Overhead (NFR66: <100ms)",
          "type": "timeseries",
          "fieldConfig": {
            "defaults": {
              "custom": {
                "drawStyle": "line",
