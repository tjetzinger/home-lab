# Custom PrometheusRule for home-lab
# Namespace: monitoring
#
# Story: 4.4 - Configure Alertmanager with Alert Rules
# FR: FR28 - System sends alerts via Alertmanager when thresholds exceeded
# NFR: NFR5 - Alertmanager sends P1 alerts within 1 minute of threshold breach
#
# Custom alert rules for home-lab specific services:
# - PostgreSQL database availability (P1)
# - NFS storage provisioner availability (P1)
# - OpenClaw gateway down (P1) - Story 24.2, FR185
# - OpenClaw CrashLoopBackOff (P2) - Story 21.4, NFR102
---
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: home-lab-custom-alerts
  namespace: monitoring
  labels:
    app.kubernetes.io/name: prometheus
    app.kubernetes.io/part-of: home-lab
    prometheus: kube-prometheus-stack-prometheus  # Required for auto-discovery
    release: kube-prometheus-stack
spec:
  groups:
    - name: home-lab-custom.rules
      interval: 30s  # Evaluate every 30 seconds to meet NFR5 (P1 alerts within 1 minute)
      rules:
        # PostgreSQL Unhealthy Alert (P1)
        #
        # Rewritten 2026-09-21 for CloudNativePG (ADR-014). The previous expression
        # watched kube_statefulset_status_replicas_ready{statefulset="postgres-postgresql"},
        # which CNPG never produces — it manages Pods from a Cluster CR, not a
        # StatefulSet. Its absent() clause fired the moment the Bitnami release was
        # uninstalled and would have stayed firing forever.
        #
        # cnpg_collector_up comes from the CNPG instance's own metrics exporter,
        # scraped via the PodMonitor enabled in applications/postgres-cnpg/cluster.yaml.
        # The absent() half is deliberate: it catches the cluster disappearing
        # entirely, not just reporting unhealthy.
        - alert: PostgreSQLUnhealthy
          expr: |
            cnpg_collector_up{namespace="data", cluster="postgres-cnpg"} == 0
            or
            absent(cnpg_collector_up{namespace="data", cluster="postgres-cnpg"})
          for: 0s  # Fire immediately - no pending period for P1
          labels:
            severity: critical
            component: database
            service: postgresql
            priority: P1
          annotations:
            summary: "PostgreSQL database unavailable"
            description: "CloudNativePG cluster 'postgres-cnpg' in namespace 'data' is not reporting healthy. Database is unavailable."
            runbook_url: "https://github.com/tjetzinger/home-lab/blob/master/docs/runbooks/postgres-restore.md"
            impact: "Paperless-ngx, Gitea, n8n, LiteLLM and Legacy-Use all lose their database"
            action: "kubectl get cluster postgres-cnpg -n data; check the postgres-cnpg-1 pod, its PVC, and NFS connectivity."

        # NFS Provisioner Unreachable Alert (P1)
        - alert: NFSProvisionerUnreachable
          expr: |
            kube_deployment_status_replicas_available{deployment="nfs-provisioner-nfs-subdir-external-provisioner", namespace="infra"} == 0
            or
            absent(kube_deployment_status_replicas_available{deployment="nfs-provisioner-nfs-subdir-external-provisioner", namespace="infra"})
          for: 0s  # Fire immediately - no pending period for P1
          labels:
            severity: critical
            component: storage
            service: nfs-provisioner
            priority: P1
          annotations:
            summary: "NFS storage provisioner unreachable"
            description: "NFS subdir external provisioner in namespace 'infra' has no available replicas. Dynamic PVC provisioning is unavailable."
            runbook_url: "https://github.com/yourusername/home-lab/blob/main/docs/runbooks/nfs-recovery.md"
            impact: "New PVC requests will fail. Stateful workloads cannot scale or restart successfully."
            action: "Check NFS provisioner pod status, logs, and Synology NFS export accessibility. Verify network connectivity to Synology."

        # vLLM GPU Inference Unavailable Alert (P2 - Informational)
        # Story: 13.3 - Integrate n8n Fallback Routing
        # FR: FR98 - Gaming Mode enables CPU fallback
        # AC: #4 - Degraded Mode Alerting
        - alert: VLLMGPUUnavailable
          expr: |
            kube_deployment_status_replicas_available{deployment="vllm-server", namespace="ml"} == 0
          for: 30s  # Wait 30s to avoid alerting during normal mode transitions
          labels:
            severity: warning
            component: ml-inference
            service: vllm
            priority: P2
          annotations:
            summary: "GPU unavailable - using CPU fallback"
            description: "vLLM GPU inference is unavailable. AI workflows are using Ollama CPU fallback with degraded performance."
            runbook_url: "https://github.com/tjetzinger/home-lab/blob/main/docs/runbooks/egpu-hotplug.md"
            impact: "AI inference latency increased. Using CPU-only Ollama with smaller models."
            action: "If gaming, this is expected. Otherwise run 'gpu-mode ml' on k3s-gpu-worker to restore GPU inference."

        # Node Memory Pressure Alert (P1)
        # Fires when any node's available memory drops below 10% for 5 minutes.
        # Root cause of cascading OOM kills (Alertmanager, NFS provisioner).
        - alert: NodeMemoryPressure
          expr: |
            (node_memory_MemAvailable_bytes / node_memory_MemTotal_bytes) * 100 < 10
          for: 5m
          labels:
            severity: critical
            component: infrastructure
            service: node
            priority: P1
          annotations:
            summary: "Node {{ $labels.instance }} under memory pressure"
            description: "Node {{ $labels.instance }} has less than 10% memory available ({{ $value | humanize }}%) for over 5 minutes. OOM kills likely."
            impact: "Pods on this node may be OOM-killed, causing cascading alert storms and service disruptions."
            action: "Check node memory: kubectl top node. Consider increasing VM memory in Proxmox or moving workloads to another node."

        # Node Memory Warning Alert (P2)
        # Early warning at 15% to allow proactive intervention.
        - alert: NodeMemoryWarning
          expr: |
            (node_memory_MemAvailable_bytes / node_memory_MemTotal_bytes) * 100 < 15
          for: 10m
          labels:
            severity: warning
            component: infrastructure
            service: node
            priority: P2
          annotations:
            summary: "Node {{ $labels.instance }} memory running low"
            description: "Node {{ $labels.instance }} has less than 15% memory available ({{ $value | humanize }}%) for over 10 minutes."
            impact: "Node approaching memory pressure. OOM kills may occur if memory usage continues to increase."
            action: "Review pod memory usage on this node: kubectl top pods --all-namespaces --field-selector spec.nodeName=<node>."

        # LiteLLM Cloud Primary Failing Over Alert (P2)
        # ADR-013 - Cloud Model Tier Refresh
        #
        # THE FAILURE THIS CATCHES: Ollama retires a model tag and the endpoint starts
        # returning HTTP 410. LiteLLM treats that as a routine failure and falls through
        # to the next tier, so the dead alias still answers and every health check stays
        # green. In Sept 2026 three aliases were dead for weeks before anyone noticed --
        # every Paperless request was silently served by a different model than configured.
        #
        # DO NOT key this on exception_status="410". Verified against a genuinely retired
        # model (kimi-k2.5): LiteLLM's ollama_chat provider wraps the upstream 410 as
        # exception_class="Ollama_chat.APIConnectionError" with exception_status="500".
        # The upstream status code never reaches the metric, so a 410 matcher never fires.
        #
        # Instead this alerts on ANY fallback away from a cloud-* alias. Cloud models are
        # hosted and highly available, so a fallback means the configured model is wrong,
        # unreachable or unauthorised -- all of which need a human. The raw counter is used
        # rather than increase()/rate() because a new failure mode creates a BRAND NEW
        # series, and increase() over a new series returns 0 (Prometheus cannot tell a new
        # series starting at 1 from a counter reset). That would miss the first occurrence,
        # which is exactly the one worth catching. The counter resets on pod restart, so
        # the alert re-fires after a restart if the problem persists.
        - alert: LiteLLMCloudPrimaryFallingBack
          expr: |
            litellm_deployment_successful_fallbacks_total{requested_model=~"cloud-.*"} > 0
            or
            litellm_deployment_failed_fallbacks_total{requested_model=~"cloud-.*"} > 0
          for: 0s  # Catch the first occurrence - silent fallback is the whole problem
          labels:
            severity: warning
            component: ml-inference
            service: litellm
            priority: P2
          annotations:
            summary: "LiteLLM cloud model '{{ $labels.requested_model }}' is falling back to '{{ $labels.fallback_model }}'"
            description: "Requests to '{{ $labels.requested_model }}' are failing ({{ $labels.exception_class }}) and being served by '{{ $labels.fallback_model }}' instead. The configured cloud model is unreachable, retired or unauthorised."
            impact: "Requests still succeed, so nothing looks broken, but they are served by a different model than configured. Quality and language behaviour may differ silently."
            action: "Check whether the model still exists: POST https://ollama.com/api/show with the model name from applications/litellm/configmap.yaml - HTTP 410 means retired. Then repoint the `model:` line and restart LiteLLM. See docs/adrs/ADR-013-cloud-model-tier-refresh.md."

        # LiteLLM Sustained Fallback Alert (P2)
        # ADR-013 - Cloud Model Tier Refresh
        #
        # Catches a primary that is persistently unhealthy for any reason (timeouts,
        # auth failure, rate limiting), not just retirement. Requests still succeed via
        # fallback, which is exactly why this needs an explicit alert.
        # Threshold is deliberately loose: a single fallback is normal, a steady stream
        # for 15 minutes means the primary is effectively down.
        - alert: LiteLLMSustainedFallback
          expr: |
            sum by (requested_model, fallback_model) (
              rate(litellm_deployment_successful_fallbacks_total[15m])
            ) > 0
          for: 15m
          labels:
            severity: warning
            component: ml-inference
            service: litellm
            priority: P2
          annotations:
            summary: "LiteLLM '{{ $labels.requested_model }}' has been failing over for 15 minutes"
            description: "Requests to '{{ $labels.requested_model }}' have been continuously served by '{{ $labels.fallback_model }}' for over 15 minutes. The configured primary is effectively unavailable."
            impact: "Inference still works but runs on a fallback model. If the whole cloud tier is affected, the next hop is vLLM on the GPU worker, which may itself be down."
            action: "Check LiteLLM logs: kubectl logs -n ml deployment/litellm --tail=100. Confirm which model actually served a request via the `model` field in a test response."

        # LiteLLM Fallback Chain Exhausted Alert (P1)
        # ADR-013 - Cloud Model Tier Refresh
        #
        # Every tier failed - cloud, GPU and CPU. Requests are now returning errors.
        - alert: LiteLLMFallbackChainExhausted
          expr: |
            increase(litellm_deployment_failed_fallbacks_total[5m]) > 0
          for: 0s
          labels:
            severity: critical
            component: ml-inference
            service: litellm
            priority: P1
          annotations:
            summary: "LiteLLM fallback chain exhausted for '{{ $labels.requested_model }}'"
            description: "Every tier in the fallback chain failed for '{{ $labels.requested_model }}'. Cloud, vLLM and Ollama are all unavailable."
            impact: "Inference is down. Paperless-GPT document processing and Open-WebUI chat will fail."
            action: "Check cloud reachability from the LiteLLM pod, then vLLM (kubectl get pods -n ml) and Ollama. Note k3s-gpu-worker may be NotReady - see docs/runbooks/egpu-hotplug.md."
