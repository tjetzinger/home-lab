# kube-prometheus-stack Helm values for home-lab
# Story: 4.1 - Deploy kube-prometheus-stack
# Epic: 4 - Observability Stack
#
# NFRs:
# - NFR13: Prometheus retains metrics for 7 days minimum
# - NFR14: Grafana dashboards load within 5 seconds
# - NFR16: All services expose Prometheus metrics on /metrics endpoint
#
# Components: Prometheus, Grafana, Alertmanager, node-exporter, kube-state-metrics
#
# CHART VERSION: 91.4.1  (prometheus-operator v0.94.0, Grafana 13.2.2, Prometheus 3.14.0)
# Upgraded from 80.14.4 on 2026-09-21. Nothing in this repo previously recorded which
# chart version was deployed - it lived only in Helm release history, the same
# reproducibility gap the floating image tags had.
#
#   helm upgrade kube-prometheus-stack prometheus-community/kube-prometheus-stack \
#     --version 91.4.1 -f monitoring/prometheus/values-homelab.yaml -n monitoring
#
# ---------------------------------------------------------------------------------
# CRDs ARE NOT UPGRADED BY HELM. Apply them BEFORE every chart upgrade.
# ---------------------------------------------------------------------------------
# The CRDs ship in a subchart's crds/ directory, which Helm installs once and never
# updates - `helm template` renders zero CustomResourceDefinition objects. Upgrading
# the chart without them leaves the new operator running against the old schema.
# The CRD sets are cumulative, so the target version's files cover every version
# skipped in between.
#
#   BASE=https://raw.githubusercontent.com/prometheus-operator/prometheus-operator/v0.94.0/example/prometheus-operator-crd
#   for c in alertmanagerconfigs alertmanagers podmonitors probes prometheusagents \
#            prometheuses prometheusrules scrapeconfigs servicemonitors thanosrulers; do
#     kubectl --context default apply --server-side --force-conflicts \
#       -f $BASE/monitoring.coreos.com_$c.yaml
#   done
#
# --server-side is required: these CRDs exceed the annotation size limit that
# client-side apply imposes. `crds.upgradeJob.enabled` is a chart-native alternative
# available since 68.4.0, deliberately not used here so the step stays visible.
#
# Breaking changes crossed in 80 -> 91, none of which needed a values change here:
#  - 89->90 removed <component>.serviceMonitor.bearerTokenFile, insecureSkipVerify,
#    caSecret/certSecret/keySecret and kubeApiServer.tlsConfig.caSecret. None were set;
#    kubeEtcd, kubeControllerManager and kubeScheduler are disabled below, and kubelet
#    and kubeApiServer use chart defaults. ignoreNamespaceSelectors is unset, so the
#    chart-created service-account token Secret lands in the right namespace.
#  - 90->91 tightened the operator ClusterRole (no wildcard verbs).
#  - 84->85 switched Prometheus and node-exporter to distroless images by default.
#  - 83->84 and 88->89 took Grafana to 13.x.

# Global labels applied to all resources
commonLabels:
  app.kubernetes.io/part-of: home-lab
  app.kubernetes.io/managed-by: helm

# Prometheus configuration
prometheus:
  prometheusSpec:
    # Discover ServiceMonitor targets through EndpointSlice rather than the v1
    # Endpoints API. Added 2026-09-22 for two reasons.
    #
    # 1. v1 Endpoints is deprecated in Kubernetes 1.33+ and every kubectl call against
    #    it now prints a deprecation warning. This cluster runs 1.34.
    #
    # 2. It is what makes kube-proxy scraping possible at all here. k3s embeds
    #    kube-proxy in the k3s process rather than running it as a DaemonSet, so the
    #    chart's Service - which selects pods labelled `k8s-app: kube-proxy` - matches
    #    nothing. Because that Service HAS a selector, the endpoints controller owns
    #    its v1 Endpoints object and keeps it empty, so a hand-written one would just
    #    be overwritten. A hand-written EndpointSlice is not managed that way and
    #    survives - see kube-proxy-endpoints.yaml - but only the EndpointSlice role
    #    reads it.
    #
    # Without this, `up{job="kube-proxy"}` had zero series and the chart's
    # `absent(up{job="kube-proxy"})` rule fired KubeProxyDown permanently: 30 days of
    # continuous critical alerts naming no node, because absent() discards all labels.
    serviceDiscoveryRole: EndpointSlice

    # Retention configuration (NFR13: 7 days minimum)
    retention: 7d
    retentionSize: "15GB"

    # Resource limits for home lab environment
    resources:
      requests:
        cpu: 500m
        memory: 2Gi
      limits:
        cpu: 1000m
        memory: 4Gi

    # Storage configuration - using emptyDir for initial deployment
    # TODO: Consider NFS PVC for persistence in future story if needed
    storageSpec:
      volumeClaimTemplate:
        spec:
          accessModes: ["ReadWriteOnce"]
          resources:
            requests:
              storage: 20Gi

    # Scrape interval and evaluation
    scrapeInterval: 30s
    evaluationInterval: 30s

    # Service monitors - enable all by default
    serviceMonitorSelectorNilUsesHelmValues: false
    podMonitorSelectorNilUsesHelmValues: false

    # Enable metrics from all namespaces
    ruleSelectorNilUsesHelmValues: false

# Grafana configuration
grafana:
  enabled: true

  # Admin credentials stored in secrets/grafana-secrets.yaml (gitignored)
  # Deployment: ./scripts/deploy-prometheus.sh (auto-merges secrets)

  # Resource limits
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: 500m
      memory: 512Mi

  # Persistence - using emptyDir for initial deployment
  persistence:
    enabled: false  # Will enable with NFS PVC in Story 4.2 if needed

  # Grafana configuration
  grafana.ini:
    server:
      root_url: "%(protocol)s://%(domain)s/"
    analytics:
      reporting_enabled: false
      check_for_updates: false

  # Prometheus datasource is automatically configured by the chart
  # Loki datasource added for log aggregation (Story 4.6)
  additionalDataSources:
    - name: Loki
      type: loki
      access: proxy
      url: http://loki.monitoring.svc.cluster.local:3100
      jsonData:
        maxLines: 1000

  # Labels for home-lab consistency
  labels:
    app.kubernetes.io/name: grafana
    app.kubernetes.io/instance: kube-prometheus-stack-grafana
    app.kubernetes.io/component: visualization
    app.kubernetes.io/part-of: home-lab

# Alertmanager configuration
alertmanager:
  enabled: true

  alertmanagerSpec:
    # Mount ntfy-credentials secret for webhook authentication (Story 27.2 - FR225)
    # Mounts at /etc/alertmanager/secrets/ntfy-credentials/
    secrets:
      - ntfy-credentials

    # Resource limits
    resources:
      requests:
        cpu: 50m
        memory: 256Mi
      limits:
        cpu: 200m
        memory: 512Mi

    # Storage - using emptyDir for initial deployment
    storage:
      volumeClaimTemplate:
        spec:
          accessModes: ["ReadWriteOnce"]
          resources:
            requests:
              storage: 2Gi

  # Alertmanager configuration (enhanced in Story 4.5 for mobile notifications)
  # FR29: Mobile notifications for P1 alerts
  # NFR5: Alert delivery within 1 minute
  config:
    global:
      resolve_timeout: 5m

    # Routing configuration - P1 alerts to mobile, others to null
    route:
      group_by: ['alertname', 'cluster', 'service']
      group_wait: 10s          # NFR5: Quick grouping for P1 alerts
      group_interval: 5m       # Subsequent alerts in same group
      repeat_interval: 4h      # Repeat notification interval for ongoing alerts
      receiver: 'null'         # Default receiver for non-critical alerts

      # Routes for specific alert severities
      routes:
        # P1/Critical alerts go to mobile notifications
        - matchers:
            - severity = "critical"
          receiver: 'mobile-notifications'
          continue: false  # Stop processing after mobile notification

        # Watchdog alert (always firing) goes to null
        - matchers:
            - alertname = "Watchdog"
          receiver: 'null'

    # Receivers configuration
    receivers:
      # Null receiver for non-critical alerts
      - name: 'null'

      # Mobile notifications via self-hosted ntfy (Story 27.2 - FR225)
      # Internal cluster delivery: Alertmanager → ntfy.monitoring.svc.cluster.local
      - name: 'mobile-notifications'
        webhook_configs:
          # Templated so the phone shows a readable alert instead of raw JSON.
          #
          # Alertmanager's webhook_configs posts its OWN fixed JSON schema and cannot be
          # templated - unlike the slack or discord receivers, the body is not
          # configurable. ntfy previously rendered that body verbatim, which is why
          # notifications arrived as a wall of JSON. ntfy's own message templating fixes
          # it at the receiving end.
          #
          # Syntax is GO TEMPLATES - {{.field}}. NOT ${field} or $(field): both are
          # accepted with HTTP 200 and passed through literally, which looks like the
          # feature is missing. Verified by experiment on 2026-09-21 against v2.28.0.
          #
          # Extended 2026-09-22: the first version sent only alertname and description,
          # so a notification could not say WHICH node or pod was affected. It now adds
          # severity and ranges over .alerts, printing whichever identifying labels each
          # alert actually carries:
          #
          #   [firing] KubePodNotReady        [firing] KubeNodeNotReady
          #   Pod not ready for 15m.          Node is not ready.
          #   severity: warning               severity: warning
          #   • ns=ml pod=vllm-abc            • node=k3s-gpu-worker
          #   • ns=gpu-operator pod=dcgm-xyz
          #
          # `{{with .labels.x}}` prints a field only when present, so each alert type
          # shows what it has and nothing renders as "<no value>".
          #
          # KubeProxyDown is the exception and will still show a bare bullet: its rule is
          # `absent(up{job="kube-proxy"})`, and absent() discards every series label by
          # design, so there is no node to name. No template can fix that.
          #
          # Percent-encoded: %7B%7B = {{ , %7D%7D = }} , %0A = newline, %20 = space.
          - url: http://ntfy.monitoring.svc.cluster.local/homelab-alerts?template=yes&title=%5B%7B%7B.status%7D%7D%5D%20%7B%7B.commonLabels.alertname%7D%7D&message=%7B%7B.commonAnnotations.description%7D%7D%0Aseverity%3A%20%7B%7B.commonLabels.severity%7D%7D%7B%7Brange%20.alerts%7D%7D%0A%E2%80%A2%7B%7Bwith%20.labels.node%7D%7D%20node%3D%7B%7B.%7D%7D%7B%7Bend%7D%7D%7B%7Bwith%20.labels.instance%7D%7D%20inst%3D%7B%7B.%7D%7D%7B%7Bend%7D%7D%7B%7Bwith%20.labels.namespace%7D%7D%20ns%3D%7B%7B.%7D%7D%7B%7Bend%7D%7D%7B%7Bwith%20.labels.pod%7D%7D%20pod%3D%7B%7B.%7D%7D%7B%7Bend%7D%7D%7B%7Bwith%20.labels.daemonset%7D%7D%20ds%3D%7B%7B.%7D%7D%7B%7Bend%7D%7D%7B%7Bwith%20.labels.deployment%7D%7D%20deploy%3D%7B%7B.%7D%7D%7B%7Bend%7D%7D%7B%7Bend%7D%7D
            send_resolved: true
            http_config:
              follow_redirects: true
              basic_auth:
                username: admin
                # Password loaded from mounted K8s Secret (ntfy-credentials) — not stored in git
                password_file: /etc/alertmanager/secrets/ntfy-credentials/NTFY_ADMIN_PASS
            max_alerts: 0  # Send all alerts, no limit

# Prometheus Node Exporter (FR26: Collect metrics from all nodes)
prometheus-node-exporter:
  enabled: true

  # Labels for home-lab consistency
  labels:
    app.kubernetes.io/name: prometheus-node-exporter
    app.kubernetes.io/instance: kube-prometheus-stack-node-exporter
    app.kubernetes.io/component: metrics
    app.kubernetes.io/part-of: home-lab

  # Resource limits
  resources:
    requests:
      cpu: 50m
      memory: 64Mi
    limits:
      cpu: 200m
      memory: 128Mi

  # Ensure node-exporter runs on ALL nodes (master + workers)
  # This satisfies AC3: Verify one pod per node
  tolerations:
    - effect: NoSchedule
      operator: Exists

# kube-state-metrics (FR27: Collect K8s object metrics)
kube-state-metrics:
  enabled: true

  # Labels for home-lab consistency
  labels:
    app.kubernetes.io/name: kube-state-metrics
    app.kubernetes.io/instance: kube-prometheus-stack-kube-state-metrics
    app.kubernetes.io/component: metrics
    app.kubernetes.io/part-of: home-lab

  # Resource limits
  resources:
    requests:
      cpu: 50m
      memory: 128Mi
    limits:
      cpu: 200m
      memory: 256Mi

# Prometheus Operator configuration
prometheusOperator:
  enabled: true

  # Resource limits
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: 500m
      memory: 256Mi

  # Labels for home-lab consistency
  labels:
    app.kubernetes.io/name: prometheus-operator
    app.kubernetes.io/instance: kube-prometheus-stack-operator
    app.kubernetes.io/component: controller
    app.kubernetes.io/part-of: home-lab

# Default rules and alerts (pre-configured)
defaultRules:
  create: true
  rules:
    alertmanager: true
    etcd: false  # K3s doesn't expose etcd metrics by default
    configReloaders: true
    general: true
    k8s: true
    kubeApiserverAvailability: true
    kubeApiserverSlos: true
    kubelet: true
    kubeProxy: true
    kubePrometheusGeneral: true
    kubePrometheusNodeRecording: true
    kubernetesApps: true
    kubernetesResources: true
    kubernetesStorage: true
    kubernetesSystem: true
    kubeScheduler: true
    kubeStateMetrics: true
    network: true
    node: true
    nodeExporterAlerting: true
    nodeExporterRecording: true
    prometheus: true
    prometheusOperator: true

# Disable components not needed for home lab
kubeEtcd:
  enabled: false  # K3s uses embedded etcd, not exposed
kubeControllerManager:
  enabled: false  # K3s runs these internally
kubeScheduler:
  enabled: false  # K3s runs these internally
kubeProxy:
  enabled: true  # K3s uses kube-proxy

# Note: Prometheus Blackbox Exporter is deployed separately via blackbox-exporter-values.yaml
# Story: 24.2 - Configure Blackbox Exporter & Alertmanager Rules
# FR184: HTTP probe monitoring for OpenClaw gateway
