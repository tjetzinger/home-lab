# ntfy Notification Server Deployment
# Namespace: monitoring
#
# Story: 27.1 - Deploy Self-Hosted ntfy to monitoring Namespace
# FR: FR224 - ntfy pod reaches Running state and passes readiness probe at /healthz
# NFR: NFR126 - Unauthenticated requests return HTTP 401
#
# Access: https://ntfy.home.jetzinger.com (Tailscale VPN only)
# Auth: AUTH_DEFAULT_ACCESS=deny enforces authentication at server level
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ntfy
  namespace: monitoring
  labels:
    app.kubernetes.io/name: ntfy
    app.kubernetes.io/instance: ntfy
    app.kubernetes.io/part-of: home-lab
    app.kubernetes.io/managed-by: kubectl
spec:
  replicas: 1

  # MUST be Recreate. The data volume is now an RWO PVC holding two SQLite files
  # (user.db, cache.db). RollingUpdate would start the new pod before terminating the
  # old one, leaving two ntfy processes on the same database. Same reason as
  # applications/gitea/values-homelab.yaml and applications/stirling-pdf.
  strategy:
    type: Recreate

  selector:
    matchLabels:
      app.kubernetes.io/name: ntfy
      app.kubernetes.io/instance: ntfy
  template:
    metadata:
      labels:
        app.kubernetes.io/name: ntfy
        app.kubernetes.io/instance: ntfy
        app.kubernetes.io/part-of: home-lab
        app.kubernetes.io/managed-by: kubectl
    spec:
      containers:
        - name: ntfy
          # v2.11.0 -> v2.28.0 on 2026-09-21, 17 minor versions. Nothing caught this
          # earlier because the tag is pinned and the pod was healthy - a pinned tag
          # only stops drift, it does not tell you the pin is stale.
          #
          # Reasons: v2.24.0 fixes case-insensitive ACL matching on SQLite, where a
          # rule for `secret` also matched a request for `SECRET` - relevant here
          # because this server runs NTFY_AUTH_DEFAULT_ACCESS=deny with per-topic ACLs.
          # v2.14.0 reworked message templating (pre-defined and custom templates),
          # which is the feature needed to stop Alertmanager webhooks arriving as raw
          # JSON on the phone.
          #
          # v2.18.0 adds an optional PostgreSQL backend; SQLite remains the default and
          # no migration is forced. The SQLite schema migrates automatically on start.
          image: binwiederhier/ntfy:v2.28.0
          args:
            - serve
          env:
            - name: NTFY_AUTH_DEFAULT_ACCESS
              value: "deny"
            - name: NTFY_BASE_URL
              value: "https://ntfy.home.jetzinger.com"
            - name: NTFY_BEHIND_PROXY
              value: "true"
            - name: NTFY_AUTH_FILE
              value: "/var/lib/ntfy/user.db"
            - name: NTFY_CACHE_FILE
              value: "/var/lib/ntfy/cache.db"
          ports:
            - name: http
              containerPort: 80
              protocol: TCP
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 10
            periodSeconds: 30
            timeoutSeconds: 5
            failureThreshold: 3
          resources:
            requests:
              memory: "64Mi"
              cpu: "50m"
            limits:
              memory: "128Mi"
              cpu: "100m"
          volumeMounts:
            - name: ntfy-data
              mountPath: /var/lib/ntfy
      volumes:
        - name: ntfy-data
          # Was `emptyDir: {}` until 2026-09-21. See monitoring/ntfy/pvc.yaml -
          # user.db holds the admin account and ACLs, and with
          # NTFY_AUTH_DEFAULT_ACCESS=deny an empty one silently stops every alert
          # reaching the phone.
          persistentVolumeClaim:
            claimName: ntfy-data
